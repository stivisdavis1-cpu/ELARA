<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Elara — Design System 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --ink:#0E2A22;
  --ink-2:#123A2F;
  --ink-3:#1A4A3C;
  --paper:#F6F4EE;
  --paper-2:#FFFFFF;
  --paper-card: color-mix(in srgb, var(--paper-2) 92%, transparent);
  --line:#E2DFD1;
  --line-soft:#ECE9DD;
  --line-active: color-mix(in srgb, var(--teal) 40%, transparent);
  --text:#1B1B15;
  --text-dim:#6B6858;
  --text-faint:#9C9986;
  --teal:#A9761F;
  --teal-deep:#7C5714;
  --teal-glow: color-mix(in srgb, var(--teal) 16%, transparent);
  --indigo:#1A4A3C;
  --indigo-deep:#0E2A22;
  --amber:#C06A2C;
  --amber-bg:#F3E2D2;
  --red:#A23B3B;
  --red-bg:#F3E2DF;
  --green:#2F7A4D;
  --green-bright:#30A462;
  --green-bg:#E3EFE6;
  --blue-bg:#E7EAE4;
  --gold-bg:#F1E4C4;
  --radius:9px;
  --radius-lg:14px;
  --shadow-ai: 0 1px 2px rgba(14,42,34,.05), 0 10px 26px -14px rgba(169,118,31,.30);
  --shadow-subtle: 0 1px 3px rgba(14,42,34,0.03), 0 12px 28px -10px color-mix(in srgb, var(--ink) 8%, transparent);

  /* Typographie : Titres Tahoma & Corps Gill Sans MT */
  --font-body: "Gill Sans MT", "Gill Sans", Calibri, "Trebuchet MS", sans-serif;
  --font-heading: Tahoma, "Trebuchet MS", sans-serif;
}

/* Hyper-responsivité : écrans 64 pouces & moniteurs 4K */
@media (min-width: 2200px) {
  :root {
    --radius-lg: 20px;
  }
  body { font-size: 16px !important; }
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--text);
  line-height:1.52;
  font-size: clamp(13px, 0.95vw, 14.5px);
  -webkit-font-smoothing:antialiased;
}

/* Grille de fond ambiante futuriste / bancaire */
.app-backdrop {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: 
    radial-gradient(circle at 85% 10%, color-mix(in srgb, var(--teal) 6%, transparent) 0%, transparent 45%),
    radial-gradient(circle at 10% 90%, color-mix(in srgb, var(--indigo) 6%, transparent) 0%, transparent 40%),
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
  opacity: 0.65;
}

h1,h2,h3,.display{
  font-family:var(--font-heading);
  font-weight:700;
  color:var(--ink);
  letter-spacing:-0.02em;
}
::selection{background:rgba(169,118,31,.25);}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100vh;position:relative;z-index:1;}
.sidebar{
  background:linear-gradient(185deg,var(--ink) 0%, var(--ink-2) 100%);
  color:#fff;
  padding:22px 16px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  border-right:1px solid #000;
  backdrop-filter: blur(14px);
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px 8px;}
.brand svg{flex-shrink:0;}
.brand-word{font-family:var(--font-heading);font-weight:700;font-size:18.5px;letter-spacing:-.02em;color:#fff;}
.brand-tag{font-size:10px;color:#8C9186;margin-top:-2px;letter-spacing:.02em;}

/* Badge Supabase / Vercel Edge Runtime */
.env-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:700;color:var(--green-bright);
  background:rgba(48,164,98,0.12);
  border:1px solid rgba(48,164,98,0.28);
  padding:3px 8px;border-radius:20px;margin-left:auto;
}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--green-bright);box-shadow:0 0 0 0 rgba(48,164,98,0.6);animation:pulseDot 2s infinite;}
@keyframes pulseDot{70%,100%{box-shadow:0 0 0 6px rgba(48,164,98,0);}}

nav.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;overflow-y:auto;padding-right:4px;}
nav.nav::-webkit-scrollbar{width:3px;}
nav.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:10px;}

.nav a{
  display:flex;align-items:center;gap:11px;
  padding:8.5px 12px 8.5px 13px;border-radius:8px;
  color:#ADB3A4;text-decoration:none;font-size:13px;font-weight:600;
  cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;
  border:1px solid transparent;border-left:2px solid transparent;
}
.nav a svg{opacity:.75;flex-shrink:0;transition:opacity .15s ease;}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav a:hover svg{opacity:1;}
.nav a.active{
  background:rgba(169,118,31,.11);
  color:#fff;
  border-color:rgba(169,118,31,.22);
  border-left:2px solid var(--teal);
  padding-left:11px;
}
.nav a.active svg{opacity:1;color:var(--teal);}
.nav a:focus-visible{outline:1.5px solid var(--teal);outline-offset:1px;}
.nav-section{font-family:var(--font-heading);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#5D6357;padding:14px 12px 5px;font-weight:700;}
.sidebar-foot{
  margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);
}
.tenant-card{
  display:flex;align-items:center;gap:10px;
  padding:10px;border-radius:10px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,0.06);
}
.tenant-avatar{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--teal),var(--indigo));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-heading);font-weight:700;font-size:12.5px;color:#fff;flex-shrink:0;
}
.tenant-name{font-size:12.5px;font-weight:700;color:#fff;}
.tenant-meta{font-size:10.5px;color:#8C9186;}

main.canvas{
  padding:clamp(22px, 3vh, 36px) clamp(24px, 3.5vw, 44px) 60px;
  max-width:1440px;width:100%;
}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;gap:20px;flex-wrap:wrap;}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-faint);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;font-family:var(--font-heading);}
.page-title{font-size:clamp(22px, 2.3vw, 30px);font-weight:700;letter-spacing:-.02em;margin:0 0 6px;}
.page-sub{color:var(--text-dim);font-size:13.5px;margin:0;max-width:580px;}
.topbar-actions{display:flex;gap:10px;flex-shrink:0;}
.btn{
  font-family:var(--font-heading);font-size:12px;font-weight:700;
  padding:9px 16px;border-radius:8px;cursor:pointer;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:transform .1s ease,box-shadow .15s ease,filter .15s ease;
}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary.teal{background:linear-gradient(135deg,var(--teal),var(--teal-deep));box-shadow:0 4px 12px -6px rgba(169,118,31,.55);color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:active{transform:translateY(1px);}
.btn-ghost{background:#fff;color:var(--text);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--text-faint);}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}
.wave-rule{width:46px;height:14px;opacity:.55;}

/* Bouton Simulateur Supabase Realtime */
.btn-live-stream{
  background:color-mix(in srgb, var(--green-bright) 12%, transparent);
  color:var(--green);
  border:1px solid color-mix(in srgb, var(--green-bright) 30%, transparent);
  font-size:11px;padding:6px 12px;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-family:var(--font-heading);font-weight:700;
}
.btn-live-stream:hover{background:color-mix(in srgb, var(--green-bright) 20%, transparent);}

/* ---------- Grilles & Cartes avec effet Spotlight interactif ---------- */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:1.5fr 1fr;}
.g2e{grid-template-columns:1fr 1fr;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);} .g2{grid-template-columns:1fr;}}

.card{
  position:relative;
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:20px 22px;
  box-shadow:var(--shadow-subtle);
  max-width:100%;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:border-color .2s ease, box-shadow .2s ease;
  overflow:hidden;
}

/* Micro-Spotlight au survol du curseur */
.card::before {
  content: '';
  position: absolute;
  top: var(--mouse-y, 50%);
  left: var(--mouse-x, 50%);
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(169,118,31,0.09) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.card:hover::before { opacity: 1; }
.card:hover{ border-color: color-mix(in srgb, var(--teal) 40%, transparent); }

.card-flat{background:transparent;border:none;padding:0;box-shadow:none;}

.kpi-label{font-family:var(--font-heading);font-size:11px;color:var(--text-dim);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:0.04em;}
.kpi-value{font-family:var(--font-heading);font-size:clamp(21px, 2vw, 27px);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
.kpi-delta{font-size:11.5px;font-weight:700;margin-top:8px;display:flex;align-items:center;gap:4px;}
.up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--text-faint);}

.ai-card{
  position:relative;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:23px 22px 20px;
  box-shadow:var(--shadow-ai);
}
.ai-card::before{
  content:'';position:absolute;top:-1px;left:20px;width:34px;height:3px;
  background:var(--teal);border-radius:0 0 3px 3px;
}
.ai-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;color:var(--ink);letter-spacing:.03em;
  text-transform:uppercase;font-family:var(--font-heading);
  background:transparent;padding:0;border-radius:0;
  margin-bottom:12px;
}
.ai-badge svg{
  width:14px;height:14px;padding:5px;flex-shrink:0;box-sizing:content-box;
  border-radius:50%;border:1.5px dashed var(--teal);
  background:var(--gold-bg);color:var(--teal-deep);
}

.section-title{font-family:var(--font-heading);font-size:14.5px;font-weight:700;margin:0 0 3px;}
.section-sub{font-size:12px;color:var(--text-dim);margin:0 0 16px;}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3.5px 9px;border-radius:20px;font-family:var(--font-heading);}
.pill-success{background:var(--green-bg);color:var(--green);}
.pill-warning{background:var(--amber-bg);color:var(--amber);}
.pill-danger{background:var(--red-bg);color:var(--red);}
.pill-info{background:var(--blue-bg);color:var(--indigo-deep);}
.pill-neutral{background:var(--paper);color:var(--text-dim);border:1px solid var(--line);}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl thead th{
  text-align:left;font-size:11px;color:var(--text-faint);font-weight:700;
  text-transform:uppercase;letter-spacing:0.04em;font-family:var(--font-heading);
  padding:0 10px 10px;border-bottom:1px solid var(--line);
}
table.tbl tbody td{padding:12px 10px;border-bottom:1px solid var(--line-soft);}
table.tbl tbody tr:last-child td{border-bottom:none;}
table.tbl tbody tr:hover{background:rgba(169,118,31,0.04);}
.name-cell{font-weight:700;}
.mono{font-variant-numeric:tabular-nums;font-weight:600;}

.progress{height:6px;border-radius:20px;background:var(--line-soft);overflow:hidden;}
.progress > div{height:100%;border-radius:20px;transition:width 0.8s cubic-bezier(0.16,1,0.3,1);}

.ring{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ring::before{content:'';position:absolute;inset:7px;background:#fff;border-radius:50%;}
.ring-val{position:relative;font-family:var(--font-heading);font-weight:700;font-size:20px;}
.ring-sub{position:relative;font-size:9px;color:var(--text-faint);margin-top:-2px;}

.divider{height:1px;background:var(--line-soft);margin:16px 0;}

.list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-soft);}
.list-row:last-child{border-bottom:none;}

.tag-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* chat */
.chat-wrap{display:flex;flex-direction:column;gap:16px;}
.msg-user{align-self:flex-end;background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px 14px 3px 14px;font-size:13px;max-width:64%;}
.msg-ai{align-self:flex-start;display:flex;gap:12px;max-width:74%;}
.msg-ai .bubble{background:#fff;border:1px solid var(--line);border-radius:3px 14px 14px 14px;padding:15px 17px;font-size:13px;line-height:1.55;}
.avatar-ai{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--indigo),var(--teal));flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.chip{font-size:11px;font-weight:700;background:var(--blue-bg);color:var(--indigo-deep);padding:5px 11px;border-radius:20px;font-family:var(--font-heading);}

/* phone mock */
.phone{width:340px;background:var(--ink);border-radius:42px;padding:12px;box-shadow:0 30px 60px -20px rgba(10,15,28,.35);}
.phone-screen{background:var(--paper);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;height:660px;}
.phone-status{display:flex;justify-content:space-between;padding:16px 24px 8px;font-size:11.5px;font-weight:700;color:var(--text-dim);font-family:var(--font-heading);}
.phone-body{padding:6px 20px 20px;}
.tabbar{display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid var(--line);background:#fff;}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--text-faint);font-family:var(--font-heading);}
.tab-item.active{color:var(--teal-deep);}

/* onboarding */
.onb-wrap{max-width:640px;margin:0 auto;}
.steps{display:flex;gap:6px;margin-bottom:28px;}
.step-seg{flex:1;height:4px;border-radius:20px;background:var(--line);}
.step-seg.done{background:linear-gradient(90deg,var(--teal),var(--indigo));}
.step-seg.current{background:var(--indigo);}
.field-label{font-family:var(--font-heading);font-size:12.5px;font-weight:700;margin:16px 0 7px;}
.field{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;font-family:var(--font-body);background:#fff;transition:border-color .15s ease,box-shadow .15s ease;}
.field:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(169,118,31,.14);}
.opt-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.opt{padding:12px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;font-family:var(--font-heading);}
.opt.sel{border-color:var(--indigo);color:var(--indigo-deep);background:var(--blue-bg);}

/* logo sheet */
.logo-hero{background:var(--ink);border-radius:22px;padding:52px 44px;display:flex;align-items:center;justify-content:center;}
.brand-lg{display:flex;align-items:center;gap:18px;}
.brand-lg .word{font-family:var(--font-heading);font-weight:700;font-size:40px;color:#fff;letter-spacing:-.02em;}
.brand-lg .tagline{font-size:13.5px;color:#8C9186;margin-top:2px;}
.swatch-row{display:flex;gap:10px;margin-top:14px;}
.swatch{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);}

.view{display:none;}
.view.active{display:block;animation:fade .22s cubic-bezier(0.16,1,0.3,1);}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){
  .view.active{animation:none;}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}

/* ---------- accessibility: visible focus ---------- */
a:focus-visible, button:focus-visible, input:focus-visible, .opt:focus-visible, .tab-pill:focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;border-radius:6px;
}
.nav a:focus-visible{outline-color:#fff;}

.nav-badge{
  margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.02em;
  background:rgba(255,255,255,.1);color:#C7CCBE;border:1px solid rgba(255,255,255,.14);
  padding:2px 6px;border-radius:20px;flex-shrink:0;font-family:var(--font-heading);
}
.nav a.active .nav-badge{background:rgba(169,118,31,.22);color:#fff;border-color:rgba(169,118,31,.4);}

.preview-banner{
  display:flex;align-items:center;gap:12px;
  background:var(--ink);color:#fff;border-radius:var(--radius-lg);
  padding:14px 20px;margin-bottom:20px;
}
.preview-banner .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;box-shadow:0 0 0 4px rgba(192,106,44,.22);}
.preview-banner strong{font-family:var(--font-heading);font-weight:700;}
.preview-banner span.muted{color:#ADB3A4;font-size:12.5px;}

.rm-card{position:relative;padding-top:26px;}
.rm-card .rm-status{position:absolute;top:20px;right:20px;}
.rm-version{font-family:var(--font-heading);font-size:12px;color:var(--text-faint);font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.rm-name{font-family:var(--font-heading);font-size:17.5px;font-weight:700;margin:4px 0 12px;}
.rm-mod{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-dim);padding:5px 0;line-height:1.5;}
.rm-mod .dot2{width:5px;height:5px;border-radius:50%;background:var(--text-faint);margin-top:6px;flex-shrink:0;}
.rm-track{display:flex;align-items:center;gap:0;margin:22px 0 28px;}
.rm-node{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:2.5px solid var(--paper);box-shadow:0 0 0 2px var(--line);}
.rm-seg{flex:1;height:2px;background:var(--line);}
.rm-seg.on{background:linear-gradient(90deg,var(--teal),var(--indigo));}
.rm-node.on{background:var(--teal);box-shadow:0 0 0 2px var(--teal);}
.rm-node.next{background:var(--amber);box-shadow:0 0 0 2px var(--amber);}

.stack-wrap{display:flex;flex-direction:column;gap:0;}
.stack-layer{
  display:flex;align-items:center;gap:16px;
  background:var(--paper-2);border:1px solid var(--line);border-radius:12px;
  padding:14px 18px;position:relative;
}
.stack-num{
  font-family:var(--font-heading);font-weight:700;font-size:13px;color:#fff;
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--teal),var(--indigo));
}
.stack-arrow{display:flex;justify-content:center;padding:3px 0;color:var(--text-faint);}
.stack-name{font-family:var(--font-heading);font-weight:700;font-size:13.5px;}
.stack-desc{font-size:12px;color:var(--text-dim);margin-top:2px;}

.validate-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 16px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:#fff;
}
.validate-row .meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;}

.tab-pill-row{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;margin-bottom:24px;}
.tab-pill{font-size:12.5px;font-weight:700;padding:7px 15px;border-radius:8px;color:var(--text-dim);cursor:pointer;border:none;background:transparent;font-family:var(--font-heading);}
.tab-pill.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,21,38,.08);}

.skip-link{position:absolute;left:-999px;top:auto;background:var(--indigo);color:#fff;padding:10px 16px;border-radius:8px;z-index:100;font-size:13px;font-weight:600;}
.skip-link:focus{left:14px;top:14px;}

.mobile-bar{

function setActive(id){
  document.querySelectorAll('.nav a').forEach(a=>{
    const isActive = a.dataset.id===id;
    a.classList.toggle('active', isActive);
    if(isActive){ a.setAttribute('aria-current','page'); } else { a.removeAttribute('aria-current'); }
  });
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='v-'+id));
  document.getElementById('brandCtx').textContent = (id==='admin'||id==='security'||id==='architecture') ? 'Console admin' : 'OrbitTech Services';
  canvas.scrollTop = 0;
}
navList.addEventListener('click', e=>{
  const a = e.target.closest('a'); if(!a) return;
  e.preventDefault();
  setActive(a.dataset.id);
  closeNav();
});

}
function closeNav(){
  sidebarEl.classList.remove('open');
  document.body.classList.remove('nav-open');
  hamburgerBtn.setAttribute('aria-expanded','false');
}
hamburgerBtn.addEventListener('click', ()=> sidebarEl.classList.contains('open') ? closeNav() : openNav());
