replicaCount: 1
image:
  repository: elara/web
  tag: onpremise
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 3000
apiNestPort: 80
secrets:
  enabled: true
  name: elara-secrets
ingress:
  enabled: true
  className: nginx
  host: elara-app.local
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
env:
  ENVIRONMENT: onpremise