replicaCount: 1
image:
  repository: elara/api-nest
  tag: staging
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 3001
apiAiPort: 80
secrets:
  enabled: true
  name: elara-secrets
ingress:
  enabled: true
  className: nginx
  host: staging.elara.app
  path: /api
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
env:
  ENVIRONMENT: staging