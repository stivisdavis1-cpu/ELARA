apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-nest
  namespace: elara-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-nest
  template:
    metadata:
      labels:
        app: api-nest
    spec:
      containers:
        - name: api-nest
          image: elara-api-nest:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: elara-config
            - secretRef:
                name: elara-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-nest-service
  namespace: elara-prod
spec:
  selector:
    app: api-nest
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
