apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-ai
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-ai
  template:
    metadata:
      labels:
        app: api-ai
    spec:
      containers:
        - name: api-ai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-api-ai-config
            {{- if .Values.secrets.enabled }}
            - secretRef:
                name: {{ .Values.secrets.name }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
