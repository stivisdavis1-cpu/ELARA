apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-ai
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-ai
  template:
    metadata:
      labels:
        app: api-ai
    spec:
      containers:
        - name: api-ai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-api-ai-config
