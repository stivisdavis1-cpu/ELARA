replicaCount: 1
image:
  repository: elara/api-ai
  tag: staging
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 8000
secrets:
  enabled: true
  name: elara-secrets
ingress:
  enabled: true
  className: nginx
  host: staging.elara.app
  path: /ai
  pathType: Prefix
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
    secretName: elara-tls-api-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 4Gi
env:
  ENVIRONMENT: staging