apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ai
  namespace: elara-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-ai
  template:
    metadata:
      labels:
        app: api-ai
    spec:
      containers:
        - name: api-ai
          image: elara-api-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: elara-config
            - secretRef:
                name: elara-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-ai-service
  namespace: elara-prod
spec:
  selector:
    app: api-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
