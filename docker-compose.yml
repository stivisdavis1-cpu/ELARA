version: '3.8'
services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: elara
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elara
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ============================================================
  # Services applicatifs ELARA (Images multi-stage, non-root)
  # ============================================================
  api-ai:
    build:
      context: ./apps/api-ai
      dockerfile: Dockerfile
    env_file:
      - ./apps/api-ai/.env
    environment:
      # Stockage filesystem local : lecture des documents depuis le volume partagé
      DOCUMENTS_DIR: /data/documents
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET_NAME: elara-documents
    ports:
      - "8000:8000"
    volumes:
      - elara_documents:/data/documents
    depends_on:
      - rabbitmq
    restart: unless-stopped

  api-nest:
    build:
      context: .
      dockerfile: apps/api-nest/Dockerfile
    env_file:
      - ./apps/api-nest/.env
    environment:
      API_AI_INTERNAL_URL: http://api-ai:8000
      OCR_SCRIPTS_DIR: /app/scripts
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # Stockage filesystem : DOCUMENTS_DIR pointe vers la racine du volume partagé
      # (les fichiers historiques y ont été écrits), le diskgroup d'archives sécurisé
      # est un sous-dossier dédié (/data/archives). La BDD ne contient que de la métadonnée.
      STORAGE_MODE: filesystem
      DOCUMENTS_DIR: /data
      ARCHIVE_DIR: /data/archives
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET_NAME: elara-documents
    ports:
      - "3001:3001"
    volumes:
      # Un seul point de montage du volume partagé : les documents de travail
      # (DOCUMENTS_DIR=/data/documents) et le diskgroup d'archives sécurisé
      # (ARCHIVE_DIR=/data/archives) sont deux sous-dossiers distincts de ce volume.
      - elara_documents:/data
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - api-ai
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_NEST_URL: http://api-nest:3001
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NODE_ENV: production
      AUTH_SECRET: dev-secret-change-me
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      KEYCLOAK_CLIENT_ID: elara-web
      KEYCLOAK_CLIENT_SECRET: elara-web-secret-123
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/Elara
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_NEST_URL: http://api-nest:3001
    ports:
      - "3000:3000"
    depends_on:
      - api-nest
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  keycloak_data:
  minio_data:
  # Volume partagé : documents reçus par api-nest sur le système de fichiers
  # (mode filesystem) et lus par le worker api-ai pour le shadow processing.
  elara_documents: