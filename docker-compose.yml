services:
  # ============================================================
  # Services d'infrastructure
  #
  # Tous portent `restart: unless-stopped` : le 2026-10-02, une excursion du
  # moteur Docker a laissé les cinq services dans l'état `Exited (255)` alors
  # que les trois services applicatifs, eux, redémarraient tout seuls. Résultat
  # : Keycloak injoignable, donc validation JWKS impossible, donc API en
  # `unhealthy` et application hors service. Un `Exited` silencieux sur un
  # service d'infrastructure ne se répare pas tout seul.
  # ============================================================
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: elara
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elara
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elara -d elara"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # `rabbitmq-diagnostics` teste le protocole AMQP réel, pas seulement le
      # processus : c'est ce qui garantit qu'une publication du scanner aboutit.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # Le realm Elara et non la racine : `/` répond avant que le realm ne soit
      # importé, et une API démarrée trop tôt ne récupère jamais ses clés RSA.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/Elara/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"issuer"' <&3
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ============================================================
  # Services applicatifs ELARA (Images multi-stage, non-root)
  # ============================================================
  api-ai:
    build:
      context: ./apps/api-ai
      dockerfile: Dockerfile
    env_file:
      - ./apps/api-ai/.env
    environment:
      # Stockage filesystem local : lecture des documents depuis le volume partagé
      DOCUMENTS_DIR: /data/documents
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET_NAME: elara-documents
    ports:
      - "8000:8000"
    volumes:
      - elara_documents:/data/documents
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  api-nest:
    build:
      context: .
      dockerfile: apps/api-nest/Dockerfile
    env_file:
      - ./apps/api-nest/.env
    environment:
      API_AI_INTERNAL_URL: http://api-ai:8000
      OCR_SCRIPTS_DIR: /app/scripts
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # Provisionnement des comptes : l'API crée l'identité Keycloak à
      # l'invitation. Le couple admin est celui du Keycloak de développement ;
      # en production, le remplacer par un compte de service
      # (KEYCLOAK_ADMIN_CLIENT_ID / KEYCLOAK_ADMIN_CLIENT_SECRET).
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: Elara
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Origine publique du site, utilisée pour composer les liens d'activation
      # remis à l'administrateur. À pointer sur le domaine réellement servi :
      # la valeur par défaut produit un lien `localhost`, ouvert sur la machine
      # de l'administrateur et non sur le site.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      # Stockage filesystem : DOCUMENTS_DIR pointe vers la racine du volume partagé
      # (les fichiers historiques y ont été écrits), le diskgroup d'archives sécurisé
      # est un sous-dossier dédié (/data/archives). La BDD ne contient que de la métadonnée.
      STORAGE_MODE: filesystem
      DOCUMENTS_DIR: /data
      ARCHIVE_DIR: /data/archives
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET_NAME: elara-documents
    ports:
      - "3001:3001"
    volumes:
      # Un seul point de montage du volume partagé : les documents de travail
      # (DOCUMENTS_DIR=/data/documents) et le diskgroup d'archives sécurisé
      # (ARCHIVE_DIR=/data/archives) sont deux sous-dossiers distincts de ce volume.
      - elara_documents:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      api-ai:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_NEST_URL: http://api-nest:3001
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NODE_ENV: production
      AUTH_SECRET: dev-secret-change-me
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      KEYCLOAK_CLIENT_ID: elara-web
      KEYCLOAK_CLIENT_SECRET: elara-web-secret-123
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/Elara
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_NEST_URL: http://api-nest:3001
    ports:
      - "3000:3000"
    depends_on:
      api-nest:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  keycloak_data:
  minio_data:
  # Volume partagé : documents reçus par api-nest sur le système de fichiers
  # (mode filesystem) et lus par le worker api-ai pour le shadow processing.
  elara_documents: